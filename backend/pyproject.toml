[project]
name = "restaurant-leads-backend"
version = "0.1.0"
description = "Restaurant leads capture & CRM backend — FastAPI + SQLAlchemy + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4.1,<5",
    "email-validator>=2.1,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "phonenumbers>=8.13,<9",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyjwt>=2.8,<3",
    "rapidfuzz>=3.6,<4",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
